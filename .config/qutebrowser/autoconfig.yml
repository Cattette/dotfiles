# If a config.py file exists, this file is ignored unless it's explicitly loaded
# via config.load_autoconfig(). For more information, see:
# https://github.com/qutebrowser/qutebrowser/blob/main/doc/help/configuring.asciidoc#loading-autoconfigyml
# DO NOT edit this file by hand, qutebrowser will overwrite it.
# Instead, create a config.py - see :help for details.

config_version: 2
settings:
  aliases:
    global:
      q: close
      qa: quit
      vidow: spawn ~/dotfiles/scripts/vidow.sh {url}
      w: session-save
      wq: quit --save
      wqa: quit --save
  auto_save.interval:
    global: 15000
  auto_save.session:
    global: true
  backend:
    global: webengine
  bindings.commands:
    global:
      normal:
        m: spawn mpv {url}
  bindings.key_mappings:
    global:
      <Ctrl-6>: <Ctrl-^>
      <Ctrl-Enter>: <Ctrl-Return>
      <Ctrl-I>: <Tab>
      <Ctrl-J>: <Return>
      <Ctrl-M>: <Return>
      <Ctrl-[>: <Escape>
      <Enter>: <Return>
      <Shift-Enter>: <Return>
      <Shift-Return>: <Return>
  colors.statusbar.caret.bg:
    global: purple
  colors.statusbar.caret.fg:
    global: white
  colors.statusbar.caret.selection.bg:
    global: '#a12dff'
  colors.statusbar.caret.selection.fg:
    global: white
  colors.statusbar.command.bg:
    global: '#000000'
  colors.statusbar.command.fg:
    global: '#afafaf'
  colors.statusbar.insert.bg:
    global: '#03A85C'
  colors.statusbar.passthrough.bg:
    global: '#2D4A96'
  colors.statusbar.url.hover.fg:
    global: '#79DAC8'
  colors.statusbar.url.success.https.fg:
    global: '#00A75A'
  colors.tabs.bar.bg:
    global: '#00A75A'
  colors.tabs.even.bg:
    global: '#000000'
  colors.tabs.indicator.start:
    global: '#0000aa'
  colors.tabs.indicator.stop:
    global: '#00aa00'
  colors.tabs.odd.bg:
    global: '#000000'
  colors.tabs.odd.fg:
    global: white
  colors.tabs.pinned.even.bg:
    global: '#CF87E8'
  colors.tabs.pinned.even.fg:
    global: black
  colors.tabs.pinned.odd.bg:
    global: '#CF87E8'
  colors.tabs.pinned.odd.fg:
    global: black
  colors.tabs.selected.even.bg:
    global: '#00A75A'
  colors.tabs.selected.even.fg:
    global: '#000000'
  colors.tabs.selected.odd.bg:
    global: '#00A75A'
  colors.tabs.selected.odd.fg:
    global: '#000000'
  completion.open_categories:
    global:
    - searchengines
    - quickmarks
    - bookmarks
    - history
    - filesystem
  content.javascript.clipboard:
    https://chatgpt.com: access-paste
    https://claude.ai: access-paste
    https://github.com: access-paste
  content.notifications.enabled:
    https://mail.proton.me: false
  content.pdfjs:
    global: true
  content.register_protocol_handler:
    https://mail.proton.me#mailto=%25s: true
  downloads.remove_finished:
    global: 5000
  editor.command:
    global:
    - footclient
    - helix
    - '{file}'
  fonts.completion.entry:
    global: default_size default_family
  fonts.debug_console:
    global: default_size default_family
  fonts.default_family:
    global: VictorMono NFM Bold
  fonts.default_size:
    global: 16pt
  fonts.downloads:
    global: default_size default_family
  input.mouse.rocker_gestures:
    global: false
  qt.force_platform:
    global: wayland
  qt.highdpi:
    global: true
  scrolling.smooth:
    global: true
  tabs.max_width:
    global: -1
  tabs.min_width:
    global: -1
  tabs.show:
    global: multiple
  tabs.tabs_are_windows:
    global: false
  tabs.title.alignment:
    global: left
  tabs.title.elide:
    global: right
  url.searchengines:
    global:
      DEFAULT: https://duckduckgo.com/?q={}
      go: https://www.google.com/search?q={}
      lb: https://letterboxd.com/search/{}
      map: https://www.google.com/maps/place/{}
      osm: https://www.openstreetmap.org/search?query={}
      r: https://reddit.com/r/{}
      w: https://en.wikipedia.org/w/index.php?search={}
  window.title_format:
    global: qutebrowser
  window.transparent:
    global: false
  zoom.default:
    global: 125%
  zoom.levels:
    global:
    - 25%
    - 33%
    - 50%
    - 67%
    - 75%
    - 90%
    - 100%
    - 110%
    - 125%
    - 150%
    - 175%
    - 200%
    - 250%
    - 300%
    - 400%
    - 500%
